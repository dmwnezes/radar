name: Diagnóstico no emulador

on:
  push:
    branches: [diagnostico]

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    env:
      RADAR_CHAVE: ${{ secrets.RADAR_CHAVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Abrir chave e compilar
        run: |
          mkdir -p app/signing
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$RADAR_CHAVE" -o app/signing/app.keystore -d assinatura/app.keystore.gpg
          ./gradlew assembleRelease --no-daemon
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/diag/rodar.sh
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "radar-diag"; git config user.email "radar-diag@users.noreply.github.com"
          git checkout --orphan diagnostico-resultado
          git rm -rfq --cached . 
          git add -f diag
          git commit -qm "Resultado do diagnóstico"
          git push -f origin diagnostico-resultado
